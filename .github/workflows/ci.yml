name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test game_core
        working-directory: packages/game_core
        run: dart test

      - name: Test game_core RNG on Node (web)
        working-directory: packages/game_core
        run: dart test -p node test/rng_test.dart

      - name: Test game_sim
        working-directory: packages/game_sim
        run: dart test
