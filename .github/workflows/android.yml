name: Android APK

on:
  push:
  workflow_dispatch:

# A newer push to the same branch makes the running APK build moot.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches Gradle's dependencies and wrapper between runs, so a build
      # doesn't fetch the Kotlin and Android plugins from Maven Central each
      # time (which has answered 429).
      - uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # A release build signed with the debug key (the template's default
      # signing config): installable for testing, not uploadable to Play.
      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: space-idle-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
